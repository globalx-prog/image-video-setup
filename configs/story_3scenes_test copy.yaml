# Demonstriert die hybride Charakter-Konsistenz:
# - Szene 1: Ref2V (Visueller Anker mit character_master.png)
# - Szene 2: I2V Handoff (Nahtlose Kamerabewegung aus dem letzten Frame von Szene 1)
