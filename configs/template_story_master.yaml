# ==============================================================================
# 🎬 MASTER-VORLAGE: Multi-Charakter KI-Film Drehbuch (5.0s pro Szene)
# ==============================================================================
# Anweisungen:
# 1. Ersetze die Bildpfade bei character_image & character2_image
# 2. Passe master_style an das gewünschte Genre an (Kamera, Licht, Look)
# 3. Definiere die Szenen: Jede Szene nennt in visible_characters und im Text
#    explizit <Picture 1> oder <Picture 2>
# 4. Beachte die kausale Kette: Jede Szene setzt die vorherige Handlung fort
# ==============================================================================

character_image: "ComfyUI/input/character1.png"
character2_image: "ComfyUI/input/character2.png"

# ==============================================================================
# 🌟 MASTER-STIL & VISUELLER ANKER (Wird jeder Szene vorangestellt)
# ==============================================================================
master_style: >-
  Master Cinematic Look: High-end cinematic aesthetic, shot on 35mm Arri Alexa 65 anamorphic lenses (2.39:1 widescreen frame), shallow depth of field, natural motion blur, authentic 35mm film grain.
  Atmosphere & Lighting: Atmospheric volumetric lighting, high-contrast chiaroscuro shadows contrasted with vibrant environmental reflections, cinematic color grading.
  Character Fidelity & Anatomy: Exact photorealistic facial and wardrobe replication from reference images (<Picture 1> [Beschreibung Figur 1], <Picture 2> [Beschreibung Figur 2]).
  Temporal Progression: Every shot advances forward in time without looping or repeating actions.

scenes:
  # --- Szene 1 (0:00 - 0:05): Establishing / Auftakt (Solo Char 1) ---
  - id: 1
    type: "ref2v"
    visible_characters:
      - "Hauptfigur 1 (<Picture 1>)"
    action: >-
      Establishing medium shot: <Picture 1> is [Name/Rolle], [visuelle Beschreibung].
      [Aktion, Bewegung durch den Raum, Scannen der Umgebung].
    camera: "Smooth dolly-out moving steadily backwards down the corridor as the character advances."
    audio: "[Foley-Schritte, atmosphärische Umgebungsgeräusche, dezente Musik-Eröffnung]."

  # --- Szene 2 (0:05 - 0:10): Weiterführung / Entdeckung (Solo Char 1) ---
  - id: 2
    type: "ref2v"
    visible_characters:
      - "Hauptfigur 1 (<Picture 1>)"
    action: >-
      <Picture 1> [Aktion setzt Szene 1 fort: nähert sich dem Ziel, entdeckt ein wichtiges Detail oder Hindernis].
    camera: "Low-angle dynamic tracking push-in following the character's movement."
    audio: "[Subtile Spannungssteigerung, mechanische Geräusche, Bass-Pulsieren]."

  # --- Szene 3 (0:10 - 0:15): Der Gegenspieler / Reveal (Solo Char 2) ---
  - id: 3
    type: "ref2v"
    visible_characters:
      - "Hauptfigur 2 (<Picture 2>)"
    action: >-
      Medium close-up reveal: <Picture 2> is [Name/Rolle], [visuelle Beschreibung].
      [Aktion: hält Requisite, bemerkt die Ankunft von Figur 1, lächelt oder reagiert].
    camera: "Dynamic rotating arc shot circling around the character."
    audio: "[Crescendo, spezifischer Requisiten-Sound, Raumhall]."

  # --- Szene 4 (0:15 - 0:20): Die Konfrontation (Two-Shot) ---
  - id: 4
    type: "ref2v"
    visible_characters:
      - "Hauptfigur 1 (<Picture 1>)"
      - "Hauptfigur 2 (<Picture 2>)"
    action: >-
      Wide cinematic two-shot:
      On the left, <Picture 1> [Position und Haltung].
      On the right, <Picture 2> [Position und Haltung].
      [Spannungsgeladene Pattsituation, Requisite sichtbar im Bild].
    camera: "Wide stationary cinematic master shot with deep anamorphic field."
    audio: "[Stille vor dem Sturm, ferne Windböen, knisternde Spannung]."

  # --- Szene 5 (0:20 - 0:25): Nahaufnahme / Forderung (Solo Char 1) ---
  - id: 5
    type: "ref2v"
    visible_characters:
      - "Hauptfigur 1 (<Picture 1>)"
    action: >-
      Intense close-up on <Picture 1>: [Mimik, fokussierter Blick].
      He/She speaks with determination: '[Dialogzeile]'.
    camera: "Tight 85mm eye-level portrait shot with shallow depth of field."
    audio: "[Trockene, klare Stimmaufnahme, metallisches Klick-Geräusch, tiefe Drohne]."

  # --- Szene 6 (0:25 - 0:30): Gegenschnitt / Reaktion (Solo Char 2) ---
  - id: 6
    type: "ref2v"
    visible_characters:
      - "Hauptfigur 2 (<Picture 2>)"
    action: >-
      Reverse-angle close-up on <Picture 2>: [Selbstsichere Mimik, feines Lächeln].
      He/She responds calmly: '[Gegen-Dialogzeile]'.
    camera: "Slight low-angle close-up emphasizing control and confidence."
    audio: "[Leises Lachen, Requisiten-SFX, anschwellender Beat]."

  # --- Szene 7 (0:30 - 0:35): Der Aktions-Trigger (Solo Char 2) ---
  - id: 7
    type: "ref2v"
    visible_characters:
      - "Hauptfigur 2 (<Picture 2>)"
    action: >-
      Kinetic explosive action: <Picture 2> abruptly [wirft/schlägt/aktiviert Requisite und sprintet zum Fluchtweg].
    camera: "Fast low-angle whip tracking shot following the rapid movement."
    audio: "[Zischen, Wurfgeräusch, schnelle Kampfstiefel-Schritte, Windstoß]."

  # --- Szene 8 (0:35 - 0:40): Die unmittelbare Konsequenz (Solo Char 1) ---
  - id: 8
    type: "ref2v"
    visible_characters:
      - "Hauptfigur 1 (<Picture 1>)"
    action: >-
      Immediate consequential reaction: <Picture 1> drops down reflexively to [fangen/ausweichen/blockieren], gaze snapping upward in sudden realization of the diversion.
    camera: "Snap zoom onto the character's reaction, tilting sharply to the face."
    audio: "[Harter Aufschlag, kurzes Einatmen, Requisiten-Klang]."

  # --- Szene 9 (0:40 - 0:45): Die Flucht / Eskalation (Solo Char 2) ---
  - id: 9
    type: "ref2v"
    visible_characters:
      - "Hauptfigur 2 (<Picture 2>)"
    action: >-
      Exterior dynamic shot: <Picture 2> vaults up onto [Geländer / Dach / Fahrzeug] overlooking the open scenery, looking back with a mock salute.
    camera: "Low-angle heroic wide shot framing the character against the sky."
    audio: "[Tosender Wind, raschelnder Mantel, Ausrüstungs-Klicken]."

  # --- Szene 10 (0:45 - 0:50): Die Verfolgung (Solo Char 1) ---
  - id: 10
    type: "ref2v"
    visible_characters:
      - "Hauptfigur 1 (<Picture 1>)"
    action: >-
      Urgent pursuit: <Picture 1> bursts through the doorway into the open elements, sprinting forward toward the ledge with hand outstretched.
    camera: "Frantic handheld tracking shot charging right behind the character."
    audio: "[Schwere Schritte, peitschender Wind, Rufe im Sturm]."

  # --- Szene 11 (0:50 - 0:55): Der spektakuläre Stunt (Solo Char 2) ---
  - id: 11
    type: "ref2v"
    visible_characters:
      - "Hauptfigur 2 (<Picture 2>)"
    action: >-
      Breathtaking plunge: <Picture 2> dives backward into the abyss, deploying [Gleiter / Fallschirm / Teleportation] and swooping away through the environment.
    camera: "Vertigo-inducing high-angle plunge tracking down into the depths."
    audio: "[Rauschen des freien Falls, Aufschnappen des Gleiters, verhallendes Rauschen]."

  # --- Szene 12 (0:55 - 1:00): Das melancholische Finale (Solo Char 1) ---
  - id: 12
    type: "ref2v"
    visible_characters:
      - "Hauptfigur 1 (<Picture 1>)"
    action: >-
      Final atmospheric master shot: <Picture 1> stands alone looking down into the distance, holding the secured [Requisite], breathing heavily as the environment calms.
    camera: "Slow cinematic pull-back crane shot ascending high, isolating the lone character."
    audio: "[Wind legt sich langsam, orchestrales Hauptthema schwillt zum Finale an]."
